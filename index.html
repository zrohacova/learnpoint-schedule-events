<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class=" content">
        <div class="filter">
            <div>
                <span class="search-icon">🔍</span>
                <input class="search" placeholder="Sök">
            </div>

            <div class="groups-filter">
            </div>

            <div class="students-filter">
                <label>Students</label>
            </div>

            <div class="room-filter">
            </div>
        </div>

        <div class="calendar">
            <div class="calendar-header">
                <div class="calendar-header-nav-buttons">
                    <button type="button" id="previousButton" class="nav-button"><</button>
                    <button type="button" id="nextButton" class="nav-button">></button>
                </div>

                <div class="calendar-header-week-date"></div>

            </div>

            <div class="calendar-view">
                <div class="calendar-days-header">
                </div>

                <div class="calendar-grid">
                    <div class="calendar-time-labels">
                        <div class="calendar-time-label">7:00</div>
                        <div class="calendar-time-label">8:00</div>
                        <div class="calendar-time-label">9:00</div>
                        <div class="calendar-time-label">10:00</div>
                        <div class="calendar-time-label">11:00</div>
                        <div class="calendar-time-label">12:00</div>
                        <div class="calendar-time-label">13:00</div>
                        <div class="calendar-time-label">14:00</div>
                        <div class="calendar-time-label">15:00</div>
                        <div class="calendar-time-label">16:00</div>
                    </div>

                    <div class="calendar-content">
                        <div class="calendar-rows">
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                            <div class="calendar-row"></div>
                        </div>
                    </div>

                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>
                    <div class="calendar-day-view">
                        <div class="calendar-day-view-data"></div>
                    </div>

                </div>

            </div>

        </div>

    </div>
    <script src="main.js"></script>
</body>

</html>
